name: Auditar AnimSets jugador B42.20

on:
  push:
    branches:
      - fix/b42-20-player-turning-desync
    paths:
      - .github/workflows/audit-player-animsets-b4220.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/audit-player-animsets-b4220.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout mínimo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows/audit-player-animsets-b4220.yml
          sparse-checkout-cone-mode: false

      - name: Extraer AnimSets de ECZ_25
        shell: bash
        run: |
          set -euo pipefail
          OUT="$HOME/audit"
          mkdir -p "$OUT/repo"
          git ls-tree -r --name-only HEAD | grep -Ei 'EclipseZ - 1/Contents/mods/ECZ_25/(42/)?media/(animsets|actiongroups)/player/' | sort > "$OUT/ecz25-player-animation-paths.txt" || true
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            mkdir -p "$OUT/repo/$(dirname "$p")"
            git show "HEAD:$p" > "$OUT/repo/$p"
          done < "$OUT/ecz25-player-animation-paths.txt"

      - name: Instalar SteamCMD
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1 ca-certificates wget tar python3
          mkdir -p "$HOME/steamcmd"
          wget -q -O "$HOME/steamcmd/steamcmd.tar.gz" https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf "$HOME/steamcmd/steamcmd.tar.gz" -C "$HOME/steamcmd"

      - name: Descargar servidor dedicado 42.20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/pzserver"
          ok=0
          for attempt in 1 2 3 4; do
            echo "Intento SteamCMD $attempt"
            if "$HOME/steamcmd/steamcmd.sh" +force_install_dir "$HOME/pzserver" +login anonymous +app_update 380870 validate +quit; then
              ok=1
              break
            fi
            sleep $((attempt * 15))
          done
          test "$ok" -eq 1

      - name: Copiar todos los gráficos vanilla del jugador
        shell: bash
        run: |
          set -euo pipefail
          OUT="$HOME/audit"
          mkdir -p "$OUT/vanilla"
          find "$HOME/pzserver/media/AnimSets/player" "$HOME/pzserver/media/actiongroups/player" -type f -name '*.xml' -print 2>/dev/null | sort > "$OUT/vanilla-player-animation-paths.txt" || true
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            rel="${p#"$HOME/pzserver/"}"
            mkdir -p "$OUT/vanilla/$(dirname "$rel")"
            cp "$p" "$OUT/vanilla/$rel"
          done < "$OUT/vanilla-player-animation-paths.txt"

      - name: Analizar estados, herencias y duplicados
        shell: bash
        run: |
          set -euo pipefail
          OUT="$HOME/audit"
          cat > "$OUT/analyse.py" <<'PY'
          from pathlib import Path
          import collections, hashlib, json, xml.etree.ElementTree as ET

          out = Path.home() / 'audit'
          repo_root = out / 'repo'
          vanilla_root = out / 'vanilla'

          def parse_tree(root):
              records = []
              for p in sorted(root.rglob('*.xml')):
                  raw = p.read_bytes()
                  try:
                      node = ET.fromstring(raw.decode('utf-8-sig'))
                      parse_error = None
                  except Exception as exc:
                      node = None
                      parse_error = str(exc)
                  name = node.findtext('m_Name') if node is not None else None
                  extends = node.attrib.get('x_extends') if node is not None else None
                  records.append({
                      'path': str(p.relative_to(root)).replace('\\','/'),
                      'name': name,
                      'extends': extends,
                      'sha256': hashlib.sha256(raw).hexdigest(),
                      'parse_error': parse_error,
                  })
              return records

          repo = parse_tree(repo_root)
          vanilla = parse_tree(vanilla_root)
          by_name_v = collections.defaultdict(list)
          by_name_r = collections.defaultdict(list)
          for r in vanilla:
              if r['name']: by_name_v[r['name'].lower()].append(r)
          for r in repo:
              if r['name']: by_name_r[r['name'].lower()].append(r)

          report = []
          report.append('AUDITORÍA ECZ_25 VS PROJECT ZOMBOID 42.20')
          report.append('=' * 52)
          report.append(f'Archivos ECZ_25 analizados: {len(repo)}')
          report.append(f'Archivos vanilla analizados: {len(vanilla)}')
          report.append('')
          report.append('ESTADOS DE ECZ_25 QUE DUPLICAN ESTADOS VANILLA')
          report.append('-' * 48)
          duplicates = []
          for key in sorted(set(by_name_r) & set(by_name_v)):
              for rr in by_name_r[key]:
                  duplicates.append(rr['path'])
                  report.append(f"MOD: {rr['path']}  estado={rr['name']}")
              for vv in by_name_v[key]:
                  report.append(f"  VANILLA: {vv['path']}")
          if not duplicates: report.append('(ninguno)')

          report.append('')
          report.append('HERENCIAS DE ECZ_25')
          report.append('-' * 22)
          unresolved = []
          repo_by_filename = collections.defaultdict(list)
          vanilla_by_filename = collections.defaultdict(list)
          for r in repo: repo_by_filename[Path(r['path']).name.lower()].append(r['path'])
          for r in vanilla: vanilla_by_filename[Path(r['path']).name.lower()].append(r['path'])
          for r in repo:
              if not r['extends']: continue
              target = Path(r['extends']).name.lower()
              candidates = repo_by_filename.get(target, []) + vanilla_by_filename.get(target, [])
              report.append(f"{r['path']} -> {r['extends']}")
              for c in candidates: report.append(f"  candidato: {c}")
              if not candidates:
                  unresolved.append(r['path'])
                  report.append('  SIN CANDIDATO')

          report.append('')
          report.append('ERRORES XML')
          report.append('-' * 11)
          errors = [r for r in repo if r['parse_error']]
          for r in errors: report.append(f"{r['path']}: {r['parse_error']}")
          if not errors: report.append('(ninguno)')

          report.append('')
          report.append('REFERENCIAS A GIROS')
          report.append('-' * 21)
          for p in sorted(repo_root.rglob('*.xml')):
              text = p.read_text('utf-8-sig', errors='replace')
              for i, line in enumerate(text.splitlines(), 1):
                  if 'turn' in line.lower():
                      report.append(f"{p.relative_to(repo_root)}:{i}: {line.strip()}")

          (out / 'audit-report.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          (out / 'audit.json').write_text(json.dumps({
              'repo': repo, 'vanilla': vanilla,
              'duplicate_mod_paths': duplicates,
              'unresolved_extends': unresolved,
              'xml_errors': errors,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          python3 "$OUT/analyse.py"

      - name: Comparar archivos con la misma ruta relativa
        shell: bash
        run: |
          set -euo pipefail
          OUT="$HOME/audit"
          mkdir -p "$OUT/diffs"
          : > "$OUT/same-path-comparison.txt"
          while IFS= read -r modfile; do
            rel="${modfile#*media/}"
            vanilla="$OUT/vanilla/media/$rel"
            if [ -f "$vanilla" ]; then
              echo "=== $modfile" >> "$OUT/same-path-comparison.txt"
              sha256sum "$modfile" "$vanilla" >> "$OUT/same-path-comparison.txt"
              safe=$(echo "$rel" | tr '/ ' '__')
              diff -u "$vanilla" "$modfile" > "$OUT/diffs/$safe.diff" || true
            fi
          done < <(find "$OUT/repo" -type f -name '*.xml' | sort)

      - name: Subir auditoría
        uses: actions/upload-artifact@v4
        with:
          name: audit-player-animsets-b4220
          path: ~/audit
          retention-days: 1
