name: Temporal inspect Workshop 3065705138

on:
  push:
    branches:
      - temp/inspect-workshop-3065705138
  pull_request:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Consultar metadatos Steam
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsS -X POST \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'itemcount=1' \
            --data-urlencode 'publishedfileids[0]=3065705138' \
            'https://api.steampowered.com/ISteamRemoteStorage/GetPublishedFileDetails/v1/' \
            | tee /tmp/workshop-metadata.json
          python3 - <<'PY'
          import json
          p='/tmp/workshop-metadata.json'
          d=json.load(open(p,encoding='utf-8'))['response']['publishedfiledetails'][0]
          print('=== STEAM METADATA ===')
          for k in ('publishedfileid','title','consumer_app_id','consumer_appid','file_size','time_updated','description'):
              if k in d:
                  print(f'{k}: {d[k]}')
          PY

      - name: Descargar Workshop con SteamCMD
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/steamcmd
          cd /tmp/steamcmd
          curl -fsSLo steamcmd.tar.gz 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz'
          tar -xzf steamcmd.tar.gz
          ./steamcmd.sh +force_install_dir /tmp/pzworkshop +login anonymous +workshop_download_item 108600 3065705138 validate +quit

      - name: Extraer Mod IDs y Map folders
        shell: bash
        run: |
          set -euxo pipefail
          ROOT='/tmp/pzworkshop/steamapps/workshop/content/108600/3065705138'
          echo '=== ROOT ==='
          echo "$ROOT"
          echo '=== MOD.INFO FILES ==='
          find "$ROOT" -type f -iname 'mod.info' -print -exec sh -c 'echo --- "$1"; cat "$1"' _ {} \;
          echo '=== MAP FOLDERS ==='
          find "$ROOT" -type d -path '*/media/maps/*' -print | sort -u
          echo '=== TOP TREE ==='
          find "$ROOT" -maxdepth 5 -print | sort | head -2000
