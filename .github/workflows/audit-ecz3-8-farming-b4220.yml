name: Auditar ECZ3_8 agricultura B42.20

on:
  push:
    branches:
      - fix/ecz3-8-farming-modal-b4220
    paths:
      - .github/workflows/audit-ecz3-8-farming-b4220.yml
      - EclipseZ - 3/Contents/mods/ECZ3_8/**
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout mínimo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            EclipseZ - 3/Contents/mods/ECZ3_8
            .github/workflows/audit-ecz3-8-farming-b4220.yml
          sparse-checkout-cone-mode: false

      - name: Preparar auditoría del mod
        shell: bash
        run: |
          set -euo pipefail
          OUT="$HOME/audit"
          MOD="EclipseZ - 3/Contents/mods/ECZ3_8"
          mkdir -p "$OUT/mod"
          find "$MOD" -type f | sort > "$OUT/ecz3_8-files.txt"
          grep -RInE 'ISPlantInfoAction|ISFarmingInfo|NR_PlantPanel|farming_vegetableconf|Plant_Highlight|Farming' "$MOD" > "$OUT/farming-references.txt" || true
          cp --parents \
            "$MOD/42/media/lua/client/NeatRocco/NR_Patches/NR_Patch_Farming.lua" \
            "$MOD/42/media/lua/client/NeatRocco/NR_Farming/NR_PlantPanel.lua" \
            "$OUT/mod/"

      - name: Instalar SteamCMD y Lua
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1 ca-certificates wget tar lua5.4
          mkdir -p "$HOME/steamcmd"
          wget -q -O "$HOME/steamcmd/steamcmd.tar.gz" https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf "$HOME/steamcmd/steamcmd.tar.gz" -C "$HOME/steamcmd"

      - name: Descargar servidor dedicado 42.20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/pzserver"
          ok=0
          for attempt in 1 2 3 4; do
            if "$HOME/steamcmd/steamcmd.sh" +force_install_dir "$HOME/pzserver" +login anonymous +app_update 380870 validate +quit; then
              ok=1
              break
            fi
            sleep $((attempt * 15))
          done
          test "$ok" -eq 1

      - name: Extraer API vanilla exacta
        shell: bash
        run: |
          set -euo pipefail
          OUT="$HOME/audit"
          VAN="$OUT/vanilla"
          mkdir -p "$VAN"
          INFO="$HOME/pzserver/media/lua/client/Farming/ISUI/ISFarmingInfo.lua"
          ACTION="$HOME/pzserver/media/lua/client/Farming/TimedActions/ISPlantInfoAction.lua"
          test -f "$INFO"
          test -f "$ACTION"
          cp "$INFO" "$VAN/ISFarmingInfo.lua"
          cp "$ACTION" "$VAN/ISPlantInfoAction.lua"
          grep -nE 'function ISFarmingInfo:(prerender|render|update|isPlantValid)|getObject|getIsoObject|updateFromIsoObject|setHeightAndParentHeight' "$INFO" > "$OUT/vanilla-farming-api.txt" || true
          grep -nE 'function ISPlantInfoAction:perform|ISFarmingWindow|ISBaseTimedAction.perform' "$ACTION" >> "$OUT/vanilla-farming-api.txt" || true
          sha256sum "$INFO" "$ACTION" > "$OUT/vanilla-sha256.txt"

      - name: Validar sintaxis actual
        shell: bash
        run: |
          set -euo pipefail
          MOD="EclipseZ - 3/Contents/mods/ECZ3_8"
          OUT="$HOME/audit"
          : > "$OUT/lua-syntax.txt"
          while IFS= read -r f; do
            if luac5.4 -p "$f" 2>> "$OUT/lua-syntax.txt"; then
              echo "OK $f" >> "$OUT/lua-syntax.txt"
            else
              echo "FAIL $f" >> "$OUT/lua-syntax.txt"
              exit 1
            fi
          done < <(find "$MOD/42/media/lua/client/NeatRocco/NR_Farming" "$MOD/42/media/lua/client/NeatRocco/NR_Patches" -type f -name '*.lua' | sort)

      - name: Subir auditoría
        uses: actions/upload-artifact@v4
        with:
          name: audit-ecz3-8-farming-b4220
          path: ~/audit
          retention-days: 1
