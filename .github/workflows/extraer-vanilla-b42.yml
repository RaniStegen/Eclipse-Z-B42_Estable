name: Extraer vanilla B42

on:
  push:
    branches:
      - agent/auditoria-modpack-b42-20
    paths:
      - ".github/workflows/extraer-vanilla-b42.yml"
  pull_request:
    paths:
      - ".github/workflows/extraer-vanilla-b42.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Instalar SteamCMD
        run: |
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -L --retry 5 --retry-delay 5 \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            -o "$RUNNER_TEMP/steamcmd.tar.gz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tar.gz" -C "$RUNNER_TEMP/steamcmd"

      - name: Descargar Project Zomboid Dedicated Server unstable
        run: |
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
            +force_install_dir "$RUNNER_TEMP/pzserver" \
            +login anonymous \
            +app_update 380870 -beta unstable validate \
            +quit

      - name: Extraer archivos vanilla relevantes
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/pzserver"
          OUT="$RUNNER_TEMP/vanilla-b42"
          mkdir -p "$OUT"
          printf 'Archivos del servidor:\n' > "$OUT/INFO.txt"
          find "$SRC" -maxdepth 2 -type f \( -name 'application_info.txt' -o -name 'version*.txt' \) -print >> "$OUT/INFO.txt" || true
          grep -R "version" "$SRC"/application_info.txt "$SRC"/projectzomboid*.json 2>/dev/null | head -100 >> "$OUT/INFO.txt" || true

          copy_one() {
            rel="$1"
            src="$SRC/$rel"
            if [ -f "$src" ]; then
              mkdir -p "$OUT/$(dirname "$rel")"
              cp "$src" "$OUT/$rel"
              sha256sum "$src" >> "$OUT/SHA256SUMS.txt"
            else
              echo "FALTA: $rel" >> "$OUT/INFO.txt"
            fi
          }

          copy_one "media/scripts/generated/entities/furniture/entity_wood_windowglass.txt"
          copy_one "media/scripts/generated/entities/walls/entity_wood_floorlvl2.txt"
          copy_one "media/scripts/generated/entities/walls/entity_wood_floorlvl3.txt"
          copy_one "media/scripts/generated/entities/walls/entity_floor_sand.txt"
          copy_one "media/scripts/generated/entities/walls/entity_floor_gravel.txt"
          copy_one "media/scripts/generated/entities/walls/entity_metal_doublewiregate.txt"

          find "$SRC/media/lua" -type f -iname '*BuildRecipeCode*.lua' -print -exec cp --parents '{}' "$OUT" \; 2>/dev/null || true
          grep -R -n "windowGlass" "$SRC/media/lua" > "$OUT/windowGlass_references.txt" 2>/dev/null || true
          grep -R -n "function BuildRecipeCode.floor" "$SRC/media/lua" > "$OUT/floor_callbacks.txt" 2>/dev/null || true

      - name: Publicar vanilla B42
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-b42-entidades
          path: ${{ runner.temp }}/vanilla-b42
          if-no-files-found: error
