name: Auditoría del modpack

on:
  push:
    branches:
      - main
      - agent/auditoria-modpack-b42-20
    paths:
      - "MODPACK-ACTUAL-EN-SERVIDOR/**"
      - ".github/workflows/auditoria-modpack.yml"
  pull_request:
    paths:
      - "MODPACK-ACTUAL-EN-SERVIDOR/**"
      - ".github/workflows/auditoria-modpack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Auditar modpack general
        id: general
        continue-on-error: true
        run: |
          python MODPACK-ACTUAL-EN-SERVIDOR/_AUDITORIA/auditar_modpack_v2.py \
            --output "$RUNNER_TEMP/resultado_auditoria"

      - name: Parte 2 - revisar mod.info, dependencias y versiones
        id: modinfo
        continue-on-error: true
        run: |
          python MODPACK-ACTUAL-EN-SERVIDOR/_AUDITORIA/auditar_modinfo_versiones.py \
            --output "$RUNNER_TEMP/resultado_modinfo_versiones"

      - name: Parte 3 - inventario bruto de conflictos
        id: conflictos_raw
        continue-on-error: true
        run: |
          python MODPACK-ACTUAL-EN-SERVIDOR/_AUDITORIA/auditar_conflictos_runtime_v3.py \
            --output "$RUNNER_TEMP/resultado_parte3_raw"

      - name: Diagnosticar GUID y outfits por género
        id: guid
        continue-on-error: true
        run: |
          python MODPACK-ACTUAL-EN-SERVIDOR/_AUDITORIA/diagnosticar_guid_ropa_v2.py \
            --output "$RUNNER_TEMP/diagnostico_guid_ropa"

      - name: Finalizar Parte 3 con resolución efectiva
        id: parte3_final
        continue-on-error: true
        run: |
          python MODPACK-ACTUAL-EN-SERVIDOR/_AUDITORIA/finalizar_auditoria_parte3.py \
            --raw "$RUNNER_TEMP/resultado_parte3_raw.json" \
            --guid "$RUNNER_TEMP/diagnostico_guid_ropa.json" \
            --output "$RUNNER_TEMP/resultado_parte3"

      - name: Generar manifiesto del repositorio
        id: manifest
        continue-on-error: true
        run: |
          python MODPACK-ACTUAL-EN-SERVIDOR/_AUDITORIA/generar_manifest_despliegue.py \
            MODPACK-ACTUAL-EN-SERVIDOR \
            --output "$RUNNER_TEMP/manifest_github.json"

      - name: Autoprueba del validador de logs
        id: runtime
        continue-on-error: true
        run: |
          python MODPACK-ACTUAL-EN-SERVIDOR/_AUDITORIA/validar_logs_runtime.py \
            --self-test \
            --output "$RUNNER_TEMP/runtime_selftest"

      - name: Diagnosticar lag y coste por mod
        id: lag
        continue-on-error: true
        run: |
          python MODPACK-ACTUAL-EN-SERVIDOR/_AUDITORIA/diagnosticar_lag_servidor.py \
            --output "$RUNNER_TEMP/diagnostico_lag_servidor"

      - name: Publicar informe general
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-modpack
          path: |
            ${{ runner.temp }}/resultado_auditoria.json
            ${{ runner.temp }}/resultado_auditoria.md
          if-no-files-found: warn

      - name: Publicar informe de la Parte 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parte-2-modinfo-versiones
          path: |
            ${{ runner.temp }}/resultado_modinfo_versiones.json
            ${{ runner.temp }}/resultado_modinfo_versiones.md
            ${{ runner.temp }}/resultado_modinfo_versiones_Mods.txt
          if-no-files-found: error

      - name: Publicar informe de la Parte 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parte-3-conflictos-runtime
          path: |
            ${{ runner.temp }}/resultado_parte3.json
            ${{ runner.temp }}/resultado_parte3.md
            ${{ runner.temp }}/resultado_parte3_raw.json
            ${{ runner.temp }}/resultado_parte3_raw.md
            ${{ runner.temp }}/diagnostico_guid_ropa.json
            ${{ runner.temp }}/diagnostico_guid_ropa.md
            ${{ runner.temp }}/manifest_github.json
          if-no-files-found: error

      - name: Publicar diagnóstico de lag
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-lag-servidor
          path: |
            ${{ runner.temp }}/diagnostico_lag_servidor.json
            ${{ runner.temp }}/diagnostico_lag_servidor.md
          if-no-files-found: error

      - name: Resultado de las auditorías
        if: always()
        run: |
          if [ "${{ steps.general.outcome }}" != "success" ] || \
             [ "${{ steps.modinfo.outcome }}" != "success" ] || \
             [ "${{ steps.guid.outcome }}" != "success" ] || \
             [ "${{ steps.parte3_final.outcome }}" != "success" ] || \
             [ "${{ steps.manifest.outcome }}" != "success" ] || \
             [ "${{ steps.runtime.outcome }}" != "success" ] || \
             [ "${{ steps.lag.outcome }}" != "success" ]; then
            echo "Una o varias auditorías efectivas han detectado errores."
            exit 1
          fi
