name: Parte 2 - mod.info y versiones

on:
  push:
    branches:
      - agent/auditoria-modpack-b42-20
    paths:
      - "MODPACK-ACTUAL-EN-SERVIDOR/**/mod.info"
      - "MODPACK-ACTUAL-EN-SERVIDOR/_AUDITORIA/auditar_modinfo_versiones.py"
      - "MODPACK-ACTUAL-EN-SERVIDOR/_AUDITORIA/configuracion_servidor_actual.json"
      - ".github/workflows/auditoria-modinfo-versiones.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/auditoria-modpack-b42-20

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar mod.info, dependencias y versiones
        run: |
          python MODPACK-ACTUAL-EN-SERVIDOR/_AUDITORIA/auditar_modinfo_versiones.py \
            --output "$RUNNER_TEMP/resultado_modinfo_versiones"

      - name: Publicar informe de la Parte 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parte-2-modinfo-versiones
          path: |
            ${{ runner.temp }}/resultado_modinfo_versiones.json
            ${{ runner.temp }}/resultado_modinfo_versiones.md
            ${{ runner.temp }}/resultado_modinfo_versiones_Mods.txt
          if-no-files-found: error
