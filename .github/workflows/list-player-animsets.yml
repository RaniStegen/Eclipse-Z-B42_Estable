name: Listar AnimSets jugador

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/list-player-animsets.yml
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows/list-player-animsets.yml
          sparse-checkout-cone-mode: false
      - name: Listar y extraer archivos sospechosos
        shell: bash
        run: |
          set -euo pipefail
          OUT="$HOME/list-player-animsets"
          mkdir -p "$OUT/files"
          git ls-tree -r --name-only HEAD | grep -Ei '/media/(animsets|actiongroups)/player/' | sort > "$OUT/all.txt" || true
          grep -Ei 'ECZ_25/.*/media/(animsets|actiongroups)/player/|/(movement|turn|turning|shove|ext)/|/(defaultwalk|shovedefault|ext0[123])\.xml$' "$OUT/all.txt" | sort -u > "$OUT/selected.txt" || true
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            mkdir -p "$OUT/files/$(dirname "$p")"
            git show "HEAD:$p" > "$OUT/files/$p"
          done < "$OUT/selected.txt"
          grep -RInE 'turning180|turningmovement180|turningidle180|turningaim180|turning' "$OUT/files" > "$OUT/turning.txt" || true
      - uses: actions/upload-artifact@v4
        with:
          name: list-player-animsets
          path: ~/list-player-animsets
          retention-days: 1
