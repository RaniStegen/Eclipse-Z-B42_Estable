name: Probar EBFCopyPaste B42.20

on:
  push:
    branches:
      - temp/test-ebfcopypaste-b4220
    paths:
      - .github/workflows/test-ebfcopypaste-b4220.yml
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Instalar SteamCMD
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq steamcmd lib32gcc-s1

      - name: Descargar servidor dedicado 42.20 estable
        run: |
          mkdir -p "$HOME/pzserver"
          steamcmd +force_install_dir "$HOME/pzserver" +login anonymous +app_update 380870 validate +quit

      - name: Descargar y adaptar EBFCopyPaste
        run: |
          mkdir -p "$HOME/workshop"
          steamcmd +force_install_dir "$HOME/workshop" +login anonymous +workshop_download_item 108600 3733024748 validate +quit
          SRC="$HOME/workshop/steamapps/workshop/content/108600/3733024748/mods/ebfcopypaste"
          mkdir -p "$HOME/Zomboid/mods/ebfcopypaste"
          cp -a "$SRC/." "$HOME/Zomboid/mods/ebfcopypaste/"
          cp -a "$HOME/Zomboid/mods/ebfcopypaste/42.19" "$HOME/Zomboid/mods/ebfcopypaste/42.20"
          rm -rf "$HOME/Zomboid/mods/ebfcopypaste/42.19"
          find "$HOME/Zomboid/mods/ebfcopypaste" -name mod.info -print0 | xargs -0 sed -i \
            -e 's/modversion=42.19.0/modversion=42.20.0/' \
            -e 's/versionMin=42.19.0/versionMin=42.20.0/' \
            -e '/versionMax=42.19.99/d'
          SHARED="$HOME/Zomboid/mods/ebfcopypaste/42.20/media/lua/shared/EBFCopyPaste/EBFCopyPaste_Shared.lua"
          SERVER="$HOME/Zomboid/mods/ebfcopypaste/42.20/media/lua/server/EBFCopyPaste/EBFCopyPaste_Server.lua"
          sed -i \
            -e 's/TargetBuild = "42.19"/TargetBuild = "42.20"/' \
            -e 's/SchemaVersion = 4219001/SchemaVersion = 4220001/' "$SHARED"
          sed -i \
            -e 's/"42.19"/"42.20"/g' \
            -e 's/4219001/4220001/g' \
            -e 's/b42.19-strict/b42.20-strict/g' \
            -e 's/B42.19/B42.20/g' "$SERVER"

      - name: Preparar servidor de prueba
        run: |
          mkdir -p "$HOME/Zomboid/Server"
          cat > "$HOME/Zomboid/Server/ebftest.ini" <<'EOF'
          Public=false
          PauseEmpty=true
          Open=false
          AutoCreateUserInWhiteList=false
          DoLuaChecksum=false
          Mods=ebfcopypaste
          WorkshopItems=
          DefaultPort=16261
          UDPPort=16262
          MaxPlayers=2
          PVP=false
          EOF

      - name: Arrancar servidor y capturar carga
        shell: bash
        run: |
          cd "$HOME/pzserver"
          set +e
          timeout 180s ./start-server.sh -servername ebftest -adminpassword Test1234 > "$HOME/server-stdout.log" 2>&1
          EXIT=$?
          set -e
          echo "exit_code=$EXIT" > "$HOME/smoke-summary.txt"
          grep -Eai "ebfcopypaste|error|exception|failed|stack trace|lua" "$HOME/server-stdout.log" | tail -n 500 >> "$HOME/smoke-summary.txt" || true
          LOG="$HOME/Zomboid/Logs/$(ls -1t "$HOME/Zomboid/Logs" 2>/dev/null | head -n1)"
          if [ -f "$LOG" ]; then
            cp "$LOG" "$HOME/pz-latest.log"
            grep -Eai "ebfcopypaste|error|exception|failed|stack trace|lua" "$LOG" | tail -n 500 >> "$HOME/smoke-summary.txt" || true
          fi
          if grep -Eai "ERROR:.*EBFCopyPaste|Exception.*EBFCopyPaste|Lua.*EBFCopyPaste" "$HOME/server-stdout.log"; then
            exit 1
          fi

      - name: Subir registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebfcopypaste-b4220-smoke-test
          path: |
            ~/server-stdout.log
            ~/smoke-summary.txt
            ~/pz-latest.log
          if-no-files-found: ignore
          retention-days: 1
