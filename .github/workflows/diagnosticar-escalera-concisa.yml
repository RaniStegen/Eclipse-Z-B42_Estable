name: Validar escaleras concisas

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/auditoria-modpack-b42-20
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar solo ECZ3_3
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            MODPACK-ACTUAL-EN-SERVIDOR/EclipseZ - 3/Contents/mods/ECZ3_3
          sparse-checkout-cone-mode: false

      - name: Instalar comprobador Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      - name: Comprobar sintaxis y cableado
        shell: bash
        run: |
          set -euo pipefail
          MOD="MODPACK-ACTUAL-EN-SERVIDOR/EclipseZ - 3/Contents/mods/ECZ3_3"
          LUA="$MOD/common/media/lua/shared/Neat_Building/Patch/NB_ConciseStairs_B42_20.lua"
          WOOD="$MOD/42.15/media/scripts/generated/entities/neat_expand/stairs/entity_wood_concisestairs.txt"
          METAL="$MOD/42.15/media/scripts/generated/entities/neat_expand/stairs/entity_welding_concisestairs.txt"

          luac5.4 -p "$LUA"

          grep -Fq 'OnCreate = NB_BuildRecipeCode.ConciseStairs.OnCreate' "$WOOD"
          grep -Fq 'OnIsValid = NB_BuildRecipeCode.ConciseStairs.OnIsValid' "$WOOD"
          grep -Fq 'OnCreate = NB_BuildRecipeCode.ConciseStairs.OnCreate' "$METAL"
          grep -Fq 'OnIsValid = NB_BuildRecipeCode.ConciseStairs.OnIsValid' "$METAL"

          for mapping in \
            'fixtures_stairs_01_82 = IsoObjectType.stairsTN' \
            'fixtures_stairs_01_81 = IsoObjectType.stairsMN' \
            'fixtures_stairs_01_80 = IsoObjectType.stairsBN' \
            'fixtures_stairs_01_90 = IsoObjectType.stairsTW' \
            'fixtures_stairs_01_89 = IsoObjectType.stairsMW' \
            'fixtures_stairs_01_88 = IsoObjectType.stairsBW' \
            'fixtures_stairs_01_2 = IsoObjectType.stairsTN' \
            'fixtures_stairs_01_1 = IsoObjectType.stairsMN' \
            'fixtures_stairs_01_0 = IsoObjectType.stairsBN' \
            'fixtures_stairs_01_10 = IsoObjectType.stairsTW' \
            'fixtures_stairs_01_9 = IsoObjectType.stairsMW' \
            'fixtures_stairs_01_8 = IsoObjectType.stairsBW'
          do
            grep -Fq "$mapping" "$LUA"
          done

          grep -Fq 'vanilla.OnCreate(params)' "$LUA"
          grep -Fq 'vanilla.OnIsValid(params)' "$LUA"
          grep -Fq 'Events.LoadGridsquare.Add(repairLoadedSquare)' "$LUA"

          {
            echo 'Sintaxis Lua: correcta'
            echo 'Escalera concisa de madera: conectada al parche'
            echo 'Escalera concisa metálica: conectada al parche'
            echo '12 sprites: tipos superior/medio/inferior asignados'
            echo 'Delegación en BuildRecipeCode.stairs de B42.20: conservada'
            echo 'Reparación de escaleras ya construidas: habilitada'
          } | tee validacion-escaleras-concisas.txt

      - name: Publicar validación
        uses: actions/upload-artifact@v4
        with:
          name: validacion-escaleras-concisas
          path: validacion-escaleras-concisas.txt
          if-no-files-found: error
