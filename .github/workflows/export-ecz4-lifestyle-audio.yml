name: Exportar ECZ_4 Lifestyle audio

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/export-ecz4-lifestyle-audio.yml
      - EclipseZ - 1/Contents/mods/ECZ_4/**
  push:
    branches: [fix/ecz4-lifestyle-audio-range]
    paths:
      - .github/workflows/export-ecz4-lifestyle-audio.yml
      - EclipseZ - 1/Contents/mods/ECZ_4/**
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            EclipseZ - 1/Contents/mods/ECZ_4
            .github/workflows/export-ecz4-lifestyle-audio.yml
          sparse-checkout-cone-mode: false
      - name: Empaquetar ECZ_4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          cp -a "EclipseZ - 1/Contents/mods/ECZ_4" export/
          find export/ECZ_4 -type f | sort > export/ARCHIVOS.txt
          grep -RInE 'PlayInstrument|playSound|soundPing|addSound|distanceMax|distanceMin|volume[[:space:]]*=' export/ECZ_4 > export/AUDIO_REFERENCIAS.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: ECZ_4_Lifestyle_actual
          path: export
          retention-days: 1
