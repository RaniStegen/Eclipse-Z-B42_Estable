name: Exportar ECZ_10 destilería

on:
  push:
    branches: [fix/ecz10-distillery-stack-b4220]
    paths:
      - .github/workflows/export-ecz10-distillery.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/export-ecz10-distillery.yml
      - EclipseZ - 1/Contents/mods/ECZ_10/**
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            EclipseZ - 1/Contents/mods/ECZ_10
            .github/workflows/export-ecz10-distillery.yml
          sparse-checkout-cone-mode: false

      - name: Empaquetar ECZ_10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/export/EclipseZ - 1/Contents/mods"
          cp -a "EclipseZ - 1/Contents/mods/ECZ_10" "$HOME/export/EclipseZ - 1/Contents/mods/"
          find "$HOME/export" -type f | sort > "$HOME/export/FILES.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ECZ_10_DISTILLERY_SOURCE
          path: ~/export
          retention-days: 1
