name: Aplicar normalización de audio Lifestyle

on:
  push:
    branches: [fix/ecz4-lifestyle-audio-range]
    paths:
      - .github/workflows/apply-ecz4-lifestyle-audio.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ecz4-lifestyle-audio-range
          fetch-depth: 0
          sparse-checkout: |
            EclipseZ - 1/Contents/mods/ECZ_4
            .github/workflows/apply-ecz4-lifestyle-audio.yml
          sparse-checkout-cone-mode: false

      - name: Instalar validador Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 zip

      - name: Atenuar pistas y reducir alcance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('EclipseZ - 1/Contents/mods/ECZ_4')
          sound_files = [
              root / 'common/media/scripts/Instruments_sounds_item.txt',
              root / 'common/media/scripts/LS_HarmonicaInstruments_sounds_item.txt',
          ]

          changed_total = 0
          volume_changes = []
          block_pattern = re.compile(r'(sound\s+([A-Za-z0-9_]+)\s*\{)(.*?)(\n\s*\})', re.S)

          for path in sound_files:
              text = path.read_text(encoding='utf-8')
              changed = 0

              def replace_block(match):
                  nonlocal changed, changed_total
                  prefix, name, body, suffix = match.groups()
                  if 'media/sound/Instruments/' not in body:
                      return match.group(0)
                  if not re.search(r'distanceMax\s*=\s*100(?:\.0+)?\s*,?', body):
                      return match.group(0)

                  old_volume_match = re.search(r'volume\s*=\s*([0-9.]+)', body)
                  new_body = re.sub(
                      r'distanceMin\s*=\s*10(?:\.0+)?\s*,\s*distanceMax\s*=\s*100(?:\.0+)?',
                      'distanceMin = 3, distanceMax = 24',
                      body,
                  )

                  if old_volume_match:
                      old_volume = float(old_volume_match.group(1))
                      # Reduce un 35 % y limita grabaciones descompensadas a 0,75.
                      new_volume = max(0.10, min(0.75, old_volume * 0.65))
                      new_volume = round(new_volume + 1e-9, 2)
                      formatted = f'{new_volume:.2f}'.rstrip('0').rstrip('.')
                      new_body = re.sub(
                          r'volume\s*=\s*[0-9.]+',
                          f'volume = {formatted}',
                          new_body,
                          count=1,
                      )
                      volume_changes.append((name, old_volume, new_volume))

                  changed += 1
                  changed_total += 1
                  return prefix + new_body + suffix

              updated = block_pattern.sub(replace_block, text)
              path.write_text(updated, encoding='utf-8')
              print(f'{path}: {changed} pistas actualizadas')

          lua_files = [
              root / 'common/media/lua/shared/TimedActions/PlayInstrumentActionNew.lua',
              root / 'common/media/lua/shared/TimedActions/PlayInstrumentTraining.lua',
              root / 'common/media/lua/shared/TimedActions/PlayInstrumentVocal.lua',
          ]

          for path in lua_files:
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  'local soundRadius, volume = 10, 5',
                  'local soundRadius, volume = 8, 3',
              )
              text = text.replace(
                  'if self.character:isOutside() then soundRadius, volume = 30, 10; end',
                  'if self.character:isOutside() then soundRadius, volume = 20, 6; end',
              )

              if path.name == 'PlayInstrumentVocal.lua':
                  repeated = '''\t\tlocal soundRadius = 10
          \t\tlocal volume = 5

          \t\tif self.character:isOutside() then
          \t\tsoundRadius = 30
          \t\tvolume = 10
          \t\tend

          \t\t-- update for zombies as the character moves

          \t\taddSound(self.character,
          \t\t\t\t self.character:getX(),
          \t\t\t\t self.character:getY(),
          \t\t\t\t self.character:getZ(),
          \t\t\t\t soundRadius,
          \t\t\t\t volume)
          '''
                  text = text.replace(
                      repeated,
                      '''\t\t-- Actualiza el ruido para zombis mientras el personaje se mueve.
          \t\tself["soundPing"](self)
          ''',
                      1,
                  )

                  fail_block = '''\tlocal soundRadius = 10
          \tlocal volume = 5

          \t\tif self.character:isOutside() then
          \t\tsoundRadius = 30
          \t\tvolume = 10
          \t\tend

          \t\tself.character:getEmitter():playSound(failsound);
          \t\t
          \t\taddSound(self.character,
          \t\t\t\t self.character:getX(),
          \t\t\t\t self.character:getY(),
          \t\t\t\t self.character:getZ(),
          \t\t\t\t soundRadius,
          \t\t\t\t volume)
          '''
                  text = text.replace(
                      fail_block,
                      '''\t\tself.character:getEmitter():playSound(failsound);
          \t\tself["soundPing"](self)
          ''',
                      1,
                  )

              path.write_text(text, encoding='utf-8')

          assert changed_total == 861, f'Se esperaban 861 pistas, se modificaron {changed_total}'
          assert len(volume_changes) == 861
          print(f'Volumen nuevo: {min(v[2] for v in volume_changes):.2f}–{max(v[2] for v in volume_changes):.2f}')
          PY

      - name: Validar resultados
        shell: bash
        run: |
          set -euo pipefail
          ROOT="EclipseZ - 1/Contents/mods/ECZ_4"
          S1="$ROOT/common/media/scripts/Instruments_sounds_item.txt"
          S2="$ROOT/common/media/scripts/LS_HarmonicaInstruments_sounds_item.txt"
          A1="$ROOT/common/media/lua/shared/TimedActions/PlayInstrumentActionNew.lua"
          A2="$ROOT/common/media/lua/shared/TimedActions/PlayInstrumentTraining.lua"
          A3="$ROOT/common/media/lua/shared/TimedActions/PlayInstrumentVocal.lua"

          test "$(grep -Ec 'distanceMin = 3, distanceMax = 24' "$S1")" -eq 816
          test "$(grep -Ec 'distanceMin = 3, distanceMax = 24' "$S2")" -eq 45
          ! grep -Eq 'distanceMax[[:space:]]*=[[:space:]]*100' "$S1"
          ! grep -Eq 'distanceMax[[:space:]]*=[[:space:]]*100' "$S2"

          for file in "$A1" "$A2" "$A3"; do
            luac5.4 -p "$file"
            grep -Fq 'local soundRadius, volume = 8, 3' "$file"
            grep -Fq 'soundRadius, volume = 20, 6' "$file"
            ! grep -Fq 'soundRadius, volume = 10, 5' "$file"
            ! grep -Fq 'soundRadius, volume = 30, 10' "$file"
          done

          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('EclipseZ - 1/Contents/mods/ECZ_4/common/media/scripts')
          for name in ['Instruments_sounds_item.txt', 'LS_HarmonicaInstruments_sounds_item.txt']:
              text = (root / name).read_text(encoding='utf-8')
              assert text.count('{') == text.count('}'), name
              sounds = len(re.findall(r'\bsound\s+[A-Za-z0-9_]+\s*\{', text))
              clips = len(re.findall(r'\bclip\s*\{', text))
              assert sounds == clips, (name, sounds, clips)
              print(name, sounds, 'sonidos válidos')
          PY

      - name: Guardar cambios
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RaniStegen"
          git config user.email "245702837+RaniStegen@users.noreply.github.com"
          git add \
            "EclipseZ - 1/Contents/mods/ECZ_4/common/media/scripts/Instruments_sounds_item.txt" \
            "EclipseZ - 1/Contents/mods/ECZ_4/common/media/scripts/LS_HarmonicaInstruments_sounds_item.txt" \
            "EclipseZ - 1/Contents/mods/ECZ_4/common/media/lua/shared/TimedActions/PlayInstrumentActionNew.lua" \
            "EclipseZ - 1/Contents/mods/ECZ_4/common/media/lua/shared/TimedActions/PlayInstrumentTraining.lua" \
            "EclipseZ - 1/Contents/mods/ECZ_4/common/media/lua/shared/TimedActions/PlayInstrumentVocal.lua"
          git diff --cached --stat
          git commit -m "Lifestyle: normalizar volumen y alcance de instrumentos"
          git push origin HEAD:fix/ecz4-lifestyle-audio-range

      - name: Exportar paquete corregido
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/export/EclipseZ - 1/Contents/mods"
          cp -a "EclipseZ - 1/Contents/mods/ECZ_4" "$HOME/export/EclipseZ - 1/Contents/mods/"
          cat > "$HOME/export/LEEME_AUDIO_LIFESTYLE.txt" <<'EOF'
          ECZ_4 — Lifestyle, normalización de instrumentos para Build 42.20

          Audio de jugadores:
          - Distancia de volumen completo: 10 -> 3 casillas.
          - Distancia máxima audible: 100 -> 24 casillas.
          - Ganancia de cada pista: -35 %, con máximo de 0,75.

          Ruido para zombis:
          - Interior: radio 10 -> 8; intensidad 5 -> 3.
          - Exterior: radio 30 -> 20; intensidad 10 -> 6.

          Se han ajustado reproducción normal, entrenamiento, duetos, canto y fallos.
          EOF
          cd "$HOME/export"
          zip -qr "$HOME/ECZ_4_B42.20_Lifestyle_Audio_Normalizado.zip" "EclipseZ - 1" LEEME_AUDIO_LIFESTYLE.txt
          sha256sum "$HOME/ECZ_4_B42.20_Lifestyle_Audio_Normalizado.zip" > "$HOME/ECZ_4_B42.20_Lifestyle_Audio_Normalizado.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ECZ_4_B42.20_Lifestyle_Audio_Normalizado
          path: |
            ~/ECZ_4_B42.20_Lifestyle_Audio_Normalizado.zip
            ~/ECZ_4_B42.20_Lifestyle_Audio_Normalizado.sha256.txt
          retention-days: 1
