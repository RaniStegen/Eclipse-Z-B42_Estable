name: Limpiar diagnóstico temporal

on:
  push:
    branches:
      - agent/auditoria-modpack-b42-20
    paths:
      - ".github/workflows/diagnosticar-equip-chat-escaleras.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auditoria-modpack-b42-20
      - name: Eliminar diagnóstico y este workflow temporal
        run: |
          set -euo pipefail
          rm -rf MODPACK-ACTUAL-EN-SERVIDOR/_AUDITORIA/TEMP_DIAGNOSTICO_EQUIP_CHAT_ESCALERAS
          git rm --ignore-unmatch .github/workflows/diagnosticar-equip-chat-escaleras.yml
          git config user.name "Eclipse-Z Diagnóstico"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No quedaban archivos temporales."
          else
            git commit -m "Eliminar diagnóstico temporal de equipamiento y escaleras"
            git push origin HEAD:agent/auditoria-modpack-b42-20
          fi
