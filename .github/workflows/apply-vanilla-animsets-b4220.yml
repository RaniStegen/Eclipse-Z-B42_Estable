name: Aplicar AnimSets vanilla B42.20 a ECZ_25

on:
  push:
    branches:
      - fix/b42-20-player-turning-desync
    paths:
      - .github/workflows/apply-vanilla-animsets-b4220.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4
        with:
          ref: fix/b42-20-player-turning-desync
          fetch-depth: 0
          sparse-checkout: |
            EclipseZ - 1/Contents/mods/ECZ_25
            .github/workflows/apply-vanilla-animsets-b4220.yml
          sparse-checkout-cone-mode: false

      - name: Instalar SteamCMD
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1 ca-certificates wget tar
          mkdir -p "$HOME/steamcmd"
          wget -q -O "$HOME/steamcmd/steamcmd.tar.gz" https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf "$HOME/steamcmd/steamcmd.tar.gz" -C "$HOME/steamcmd"

      - name: Descargar servidor dedicado 42.20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/pzserver"
          ok=0
          for attempt in 1 2 3 4; do
            if "$HOME/steamcmd/steamcmd.sh" +force_install_dir "$HOME/pzserver" +login anonymous +app_update 380870 validate +quit; then
              ok=1
              break
            fi
            sleep $((attempt * 15))
          done
          test "$ok" -eq 1

      - name: Sustituir las siete bases antiguas
        shell: bash
        run: |
          set -euo pipefail
          DST="EclipseZ - 1/Contents/mods/ECZ_25/42/media/AnimSets/player"
          SRC="$HOME/pzserver/media/AnimSets/player"
          mkdir -p "$DST/ext" "$DST/melee/2handed" "$DST/movement" "$DST/shove"
          cp "$SRC/ext/Ext01.xml" "$DST/ext/Ext01.xml"
          cp "$SRC/ext/Ext02.xml" "$DST/ext/Ext02.xml"
          cp "$SRC/ext/Ext03.xml" "$DST/ext/Ext03.xml"
          cp "$SRC/melee/2handed/ChainsawDefault.xml" "$DST/melee/2handed/ChainsawDefault.xml"
          cp "$SRC/melee/2handed/ChainsawMiss.xml" "$DST/melee/2handed/ChainsawMiss.xml"
          cp "$SRC/movement/defaultWalk.xml" "$DST/movement/defaultWalk.xml"
          cp "$SRC/shove/ShoveDefault.xml" "$DST/shove/ShoveDefault.xml"

          mkdir -p \
            "EclipseZ - 1/Contents/mods/ECZ_25/common/media/AnimSets" \
            "EclipseZ - 1/Contents/mods/ECZ_25/common/media/actiongroups" \
            "EclipseZ - 1/Contents/mods/ECZ_25/42/media/actiongroups"
          : > "EclipseZ - 1/Contents/mods/ECZ_25/common/media/AnimSets/.keep"
          : > "EclipseZ - 1/Contents/mods/ECZ_25/common/media/actiongroups/.keep"
          : > "EclipseZ - 1/Contents/mods/ECZ_25/42/media/actiongroups/.keep"

          sha256sum \
            "$DST/ext/Ext01.xml" \
            "$DST/ext/Ext02.xml" \
            "$DST/ext/Ext03.xml" \
            "$DST/melee/2handed/ChainsawDefault.xml" \
            "$DST/melee/2handed/ChainsawMiss.xml" \
            "$DST/movement/defaultWalk.xml" \
            "$DST/shove/ShoveDefault.xml"

      - name: Confirmar cambios en la rama
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ECZ Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "EclipseZ - 1/Contents/mods/ECZ_25"
          if git diff --cached --quiet; then
            echo 'No hay cambios que confirmar.'
            exit 0
          fi
          git commit -m 'B42.20: restaurar bases vanilla del gráfico de jugador'
          git push origin HEAD:fix/b42-20-player-turning-desync
