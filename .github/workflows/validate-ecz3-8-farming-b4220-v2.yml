name: Validar ECZ3_8 agricultura B42.20 v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/validate-ecz3-8-farming-b4220-v2.yml
      - EclipseZ - 3/Contents/mods/ECZ3_8/**
  push:
    branches: [fix/ecz3-8-farming-modal-b4220]
    paths:
      - .github/workflows/validate-ecz3-8-farming-b4220-v2.yml
      - EclipseZ - 3/Contents/mods/ECZ3_8/**

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            EclipseZ - 3/Contents/mods/ECZ3_8
            .github/workflows/validate-ecz3-8-farming-b4220-v2.yml
          sparse-checkout-cone-mode: false

      - name: Instalar Lua y ZIP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 zip
          mkdir -p "$HOME/validation"

      - name: Sintaxis Lua
        shell: bash
        run: |
          set -euo pipefail
          MOD="EclipseZ - 3/Contents/mods/ECZ3_8"
          while IFS= read -r f; do
            luac5.4 -p "$f"
            echo "OK $f"
          done < <(find "$MOD/42/media/lua" -type f -name '*.lua' | sort) | tee "$HOME/validation/lua-syntax.txt"

      - name: Simular error de render, cierre y fallback
        shell: bash
        run: |
          set -euo pipefail
          MOD="EclipseZ - 3/Contents/mods/ECZ3_8"
          PANEL="$MOD/42/media/lua/client/NeatRocco/NR_Farming/NR_PlantPanel.lua"
          PATCH="$MOD/42/media/lua/client/NeatRocco/NR_Patches/NR_Patch_Farming.lua"
          TEST="$HOME/validation/test-farming.lua"

          cat > "$TEST" <<'LUA'
          local PANEL_PATH = assert(os.getenv('PANEL_PATH'))
          local PATCH_PATH = assert(os.getenv('PATCH_PATH'))

          package.preload['NeatRocco/NR_Utils/NR_BasePanel'] = function() return true end
          package.preload['NeatRocco/NR_Utils/NR_CollapseUtils'] = function() return true end
          package.preload['NeatRocco/NR_Config'] = function() return true end
          package.preload['NeatRocco/NR_Farming/NR_PlantPanel'] = function() return NR_PlantPanel end

          local function derive(base, name)
              local cls = { Type=name }
              cls.__index = cls
              setmetatable(cls, { __index=base })
              function cls:derive(child) return derive(self, child) end
              return cls
          end

          ISPanelJoypad = { __index=nil }
          ISPanelJoypad.__index = ISPanelJoypad
          function ISPanelJoypad:derive(name) return derive(self, name) end
          function ISPanelJoypad.new(self, x, y, w, h)
              local o = setmetatable({x=x,y=y,width=w,height=h,visible=false}, self)
              function o:setWantKeyEvents() end
              function o:setWidth(v) self.width=v end
              function o:setHeight(v) self.height=v end
              function o:setVisible(v) self.visible=v end
              function o:addToUIManager() self.visible=true self.added=true end
              function o:removeFromUIManager() self.visible=false self.removed=true end
              function o:isReallyVisible() return self.visible end
              function o:initialise() end
              function o:drawText() end
              return o
          end
          function ISPanelJoypad.render() end
          function ISPanelJoypad.update() end
          function ISPanelJoypad.onJoypadDown() end

          ISFarmingInfo = ISPanelJoypad:derive('ISFarmingInfo')
          function ISFarmingInfo.prerender() end
          function ISFarmingInfo.render(self)
              self:drawText('Etiqueta', 13, 0, 1, 1, 1, 1)
              error('fallo de render forzado')
          end

          NR_Config={padding=6,headerHeight=30,buttonSize=20,lineHeight=18,barHeight=10}
          NR_CollapseUtils={
              init=function() end,
              isBodyVisible=function() return true end,
              update=function() end,
              onClickCollapse=function() end,
              onHeaderHover=function() end,
          }
          NR_BasePanel={
              initBase=function() end,
              createChildren=function(self) self.header={setWidth=function() end,calculateLayout=function() end} end,
              prerender=function() end,
              closeBase=function(self) self.visible=false self.removed=true end,
          }
          NR_DrawUtils={drawLabelValue=function() end}
          NR_DrawBar={drawBar=function() end}

          UIFont={Small=1,Medium=2}
          Keyboard={KEY_ESCAPE=1}
          Joypad={BButton=2}
          JoypadState={players={}}
          farming_vegetableconf={props={}}
          function getTextManager()
              return {getFontHeight=function() return 12 end,MeasureStringX=function(_,_,s) return #tostring(s or '') end}
          end
          function getText(k) return k end
          function getTexture() return nil end
          function getPlayerScreenLeft() return 0 end
          function getPlayerScreenTop() return 0 end

          local vanillaCalls, baseCalls = 0, 0
          ISPlantInfoAction={perform=function() vanillaCalls=vanillaCalls+1 end}
          ISBaseTimedAction={perform=function() baseCalls=baseCalls+1 end}
          function NR_RegisterWindowToggleCallback(_, cb) cb(true) end

          dofile(PANEL_PATH)
          dofile(PATCH_PATH)

          local character={getPlayerNum=function() return 0 end,DistTo=function() return 0 end}
          local square={getX=function() return 1 end,getY=function() return 1 end}
          local plant={
              typeOfSeed='CultivoPersonalizadoSinIcono',
              updateFromIsoObject=function() end,
              getIsoObject=function() return {} end,
              getObject=function() return {} end,
              getSquare=function() return square end,
          }
          local action={character=character,plant=plant,playerNum=0}

          local customPerform=ISPlantInfoAction.perform
          customPerform(action)
          assert(baseCalls==1, 'la acción personalizada no finalizó')
          local panel=assert(NR_PlantPanel.panels[character], 'no se creó el panel')
          assert(panel.vegetable==nil, 'un cultivo sin icono no debe fallar')
          local originalDrawText=rawget(panel,'drawText')

          panel:render()
          assert(panel._closed==true, 'el panel con error no se cerró')
          assert(panel._drawHooksActive==false, 'los hooks quedaron activos')
          assert(rawget(panel,'drawText')==originalDrawText, 'drawText no recuperó su valor original')
          assert(NR_FarmingUIState.disabledForSession==true, 'no se activó el fallback')
          assert(ISPlantInfoAction.perform==ISPlantInfoAction._NR_old_perform, 'no se restauró vanilla')

          ISPlantInfoAction.perform(action)
          assert(vanillaCalls==1, 'el siguiente intento no usó vanilla')

          NR_FarmingUIState.disabledForSession=false
          ISPlantInfoAction.perform=customPerform
          NR_PlantPanel.panels={}
          local originalNew=NR_PlantPanel.new
          NR_PlantPanel.new=function() error('fallo de construcción forzado') end
          customPerform(action)
          NR_PlantPanel.new=originalNew
          assert(vanillaCalls==2, 'el fallo de apertura no recurrió a vanilla')

          print('OK: cierre, restauración de hooks, finalización y fallback comprobados')
          LUA

          PANEL_PATH="$PANEL" PATCH_PATH="$PATCH" lua5.4 "$TEST" | tee "$HOME/validation/mock-test.txt"

      - name: Comprobaciones estáticas
        shell: bash
        run: |
          set -euo pipefail
          MOD="EclipseZ - 3/Contents/mods/ECZ3_8"
          PANEL="$MOD/42/media/lua/client/NeatRocco/NR_Farming/NR_PlantPanel.lua"
          PATCH="$MOD/42/media/lua/client/NeatRocco/NR_Patches/NR_Patch_Farming.lua"
          grep -Fq 'self:_restoreDrawHooks()' "$PANEL"
          grep -Fq 'NR_FarmingUI_DisableForSession' "$PANEL"
          grep -Fq 'NR_fallbackToVanilla' "$PATCH"
          grep -Fq 'ISBaseTimedAction.perform(self)' "$PATCH"
          ! grep -Fq 'farming_vegetableconf.props[plant.typeOfSeed].icon' "$PANEL"
          printf '%s\n' \
            'Lua válido' \
            'Hooks restaurados tras excepción' \
            'Panel cerrado tras excepción' \
            'Fallback vanilla operativo' \
            'Acción temporizada finalizada' \
            'Cultivos sin icono admitidos' > "$HOME/validation/summary.txt"

      - name: Exportar paquete
        shell: bash
        run: |
          set -euo pipefail
          OUT="$HOME/export"
          mkdir -p "$OUT/EclipseZ - 3/Contents/mods"
          cp -a "EclipseZ - 3/Contents/mods/ECZ3_8" "$OUT/EclipseZ - 3/Contents/mods/"
          cat > "$OUT/INSTALACION.txt" <<'EOF'
          ECZ3_8 — corrección de «Ver estado de cosecha» para Build 42.20

          Detén el servidor y cierra todos los clientes. Elimina la carpeta ECZ3_8
          anterior y sustitúyela por la incluida. Todos los clientes deben usar la
          misma versión.

          Si el panel Neat encuentra un cultivo o parche incompatible, se cierra sin
          quedar bloqueado, restaura los métodos de dibujo y activa la ventana vanilla
          durante el resto de esa sesión.
          EOF
          cd "$OUT"
          zip -qr "$HOME/ECZ3_8_B42.20_Estado_Cosecha_Fix.zip" "EclipseZ - 3" INSTALACION.txt
          sha256sum "$HOME/ECZ3_8_B42.20_Estado_Cosecha_Fix.zip" > "$HOME/ECZ3_8_B42.20_Estado_Cosecha_Fix.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ECZ3_8_B42.20_Estado_Cosecha_Fix_v2
          path: |
            ~/ECZ3_8_B42.20_Estado_Cosecha_Fix.zip
            ~/ECZ3_8_B42.20_Estado_Cosecha_Fix.sha256.txt
            ~/validation
          retention-days: 1
